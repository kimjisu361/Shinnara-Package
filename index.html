<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신나라패키지 | 아이돌 굿즈 및 각종 굿즈 포장 전문</title>
    <meta name="description" content="신나라패키지는 아이돌 굿즈를 비롯한 다양한 굿즈의 포장을 전문으로 상담하는 업체입니다. 다양한 굿즈 포장 관련 문의를 환영합니다." />
    <meta property="og:title" content="신나라패키지 | 아이돌 굿즈 및 각종 굿즈 포장 전문" />
    <meta property="og:description" content="아이돌 굿즈부터 다양한 종류의 굿즈까지, 포장 관련 상담은 신나라패키지에 문의하세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="google-site-verification" content="0z4S-bEWh9DlJgSmnSdSna1ehDeFersYay_cyaiZOiU" />
    <meta name="naver-site-verification" content="e80a86bef8c887d4ab71fe354822892d64a6ae3c" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Netlify Forms detection for static crawl at build time -->
    <form name="quote-form" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="quote-form" />
      <input type="hidden" name="bot-field" />
      <input type="hidden" name="subject" />

      <!-- 1. 고객 정보 -->
      <input type="text" name="[고객 정보] 업체명" />
      <input type="text" name="[고객 정보] 담당자" />
      <input type="tel" name="[고객 정보] 연락처" />
      <input type="email" name="[고객 정보] 이메일" />

      <!-- 2. 굿즈 및 포장 정보 -->
      <input type="text" name="[굿즈 및 포장 정보] 굿즈 종류" />
      <input type="text" name="[굿즈 및 포장 정보] 예상 수량" />
      <input type="text" name="[굿즈 및 포장 정보] 굿즈 크기" />
      <input type="text" name="[굿즈 및 포장 정보] 포장 방식" />
      <input type="text" name="[굿즈 및 포장 정보] 자재 준비" />

      <!-- 3. 일정 및 추가 요청 사항 -->
      <input type="text" name="[일정 및 추가 요청 사항] 희망 일정" />
      <input type="text" name="[일정 및 추가 요청 사항] 첨부 파일" />
      <textarea name="[일정 및 추가 요청 사항] 추가 요청 사항"></textarea>
      <input type="text" name="개인정보 수집·이용 동의" />

      <!-- 첨부 파일 -->
      <input type="file" name="file" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
